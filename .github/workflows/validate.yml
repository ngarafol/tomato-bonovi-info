name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  status:
    needs: [hacs, hassfest]
    runs-on: ubuntu-latest
    steps:
      - name: Rezultat validacije
        run: |
          {
            echo "### Validacija integracije"
            echo ""
            echo "| provjera | rezultat |"
            echo "|---|---|"
            echo "| HACS | ${{ needs.hacs.result }} |"
            echo "| hassfest | ${{ needs.hassfest.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
